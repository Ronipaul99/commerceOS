# Stage 01 local HTTP proxy. TLS/OCI hardening belongs to Stage 06.
upstream tiyas_web { server web:3000; }
upstream tiyas_api { server api:4000; }
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://tiyas_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        # Payment verification/webhooks may make several bounded provider API calls.
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://tiyas_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
