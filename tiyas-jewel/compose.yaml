name: tiyas-jewel
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiyas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tiyas_jewel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published database port. Host dev uses the explicit loopback-only override.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tiyas}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tiyas_jewel}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-local}
      STORAGE_LOCAL_DIR: /app/var/uploads
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT:-}
      OCI_REGION: ${OCI_REGION:-}
      OCI_BUCKET: ${OCI_BUCKET:-}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID:-}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY:-}
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-disabled}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      COD_ENABLED: ${COD_ENABLED:-false}
      SHIPPING_FEE_PAISE: ${SHIPPING_FEE_PAISE:-9900}
      FREE_SHIPPING_THRESHOLD_PAISE: ${FREE_SHIPPING_THRESHOLD_PAISE:-199900}
      SERVICEABLE_PIN_CODES: ${SERVICEABLE_PIN_CODES:-}
      TAX_MODE: ${TAX_MODE:-inclusive}
      TAX_BPS: ${TAX_BPS:-0}
      RESERVATION_MINUTES: ${RESERVATION_MINUTES:-15}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tiyas}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tiyas_jewel}?schema=public
    volumes:
      - product_images:/app/var/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    command: ["npm", "run", "db:seed"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-tiyas}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tiyas_jewel}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  nginx:
    profiles: ["edge"]
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  product_images:
  postgres_data:
